  research_question: How does excessive internal deliberation ('overthinking') in large reasoning models
    affect performance and cost on interactive agentic tasks?
  setup: 'Analyzed 4,018 trajectories on SWE-Bench Verified software-engineering tasks; built an overthinking-score
    framework (validated against expert human ratings) identifying three failure patterns: Analysis Paralysis,
    Rogue Actions, Premature Disengagement.'
  main_findings: Higher overthinking scores correlate with worse task performance; reasoning models overthink
    more than non-reasoning models; simple mitigation (selecting the lower-overthinking solution) recovers
    large gains at lower cost; function-calling capability and selective RL are proposed mitigations.
  quantitative_results: 'From the abstract: selecting solutions with lower overthinking scores improves
    performance by ~30% while reducing computational costs by 43%; overthinking scores inversely correlate
    with task performance across 4,018 trajectories.'
  limitations: Score↔performance link is correlational; the 30%/43% result comes from a post-hoc selection
    intervention, not from training models to think less; single domain (SWE).
  evidence_nature: correlational (with an interventional selection result supporting a causal reading)
  relevance: 'Justifies optimizer rules that cap deliberation in agent loops: prefer acting/tool-calling
    over extended reasoning chains, add early-termination heuristics, and treat long reasoning traces
    in agentic contexts as a defect signal, not diligence.'
  generalizes_across_models: partial — pattern strongest in reasoning models (o1-like); non-reasoning
    models overthink less
