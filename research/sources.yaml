records:
- id: S-A01
  title: 'LLMLingua: Compressing Prompts for Accelerated Inference of Large Language Models'
  authors: Huiqiang Jiang et al. (Microsoft)
  venue: EMNLP 2023 (main); arXiv
  year: 2023
  url: https://arxiv.org/abs/2310.05736
  arxiv_id: '2310.05736'
  doi: 10.48550/arXiv.2310.05736
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: Can prompts be compressed at high ratios (coarse-to-fine, token-level) without losing
    downstream task performance?
  setup: Budget controller + token-level iterative compression + instruction-tuning-based distribution
    alignment between a small compressor LM and the target LLM; evaluated on GSM8K, BBH, ShareGPT, Arxiv-March23.
  main_findings: Coarse-to-fine perplexity-guided token dropping achieves state-of-the-art compression;
    semantic integrity is maintainable at high ratios if a budget controller allocates compression unevenly
    (e.g., protecting instructions/questions more than demonstrations).
  quantitative_results: Up to 20x compression with 'little performance loss' (stated in arXiv abstract).
    No per-task deltas given in the abstract.
  limitations: Requires a compressor LM aligned with the target model's distribution; abstract does not
    quantify the loss at 20x; evaluated on 2023-era GPT-3.5-class targets.
  evidence_nature: causal
  relevance: Foundational baseline for any skill/prompt compression rule; supports unequal budget allocation
    — compress examples/context aggressively, protect instructions.
  generalizes_across_models: partial
  confidence: high
  verification_status: verified-primary
- id: S-A02
  title: 'LongLLMLingua: Accelerating and Enhancing LLMs in Long Context Scenarios via Prompt Compression'
  authors: Huiqiang Jiang et al. (Microsoft)
  venue: ACL 2024 (main); arXiv
  year: 2024
  url: https://arxiv.org/abs/2310.06839
  arxiv_id: '2310.06839'
  doi: 10.48550/arXiv.2310.06839
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: Can question-aware prompt compression simultaneously cut cost AND improve accuracy
    in long-context scenarios (countering position bias / lost-in-the-middle)?
  setup: Question-aware coarse-to-fine compression + document reordering; benchmarks incl. NaturalQuestions
    and LooGLE; target model GPT-3.5-Turbo.
  main_findings: Compression is not only lossless in some regimes — it can INCREASE accuracy by increasing
    the density of query-relevant information and mitigating position bias in long contexts.
  quantitative_results: Up to +21.4% on NaturalQuestions with 4x fewer tokens in GPT-3.5-Turbo; 94.0%
    cost reduction on LooGLE; 1.4x-2.6x end-to-end latency speedup at 2x-6x compression of ~10k-token
    prompts (all stated in arXiv abstract).
  limitations: Gains concentrated in retrieval-style long-context tasks; requires knowing the question
    at compression time (not applicable to reusable static skill text compressed offline without a query).
  evidence_nature: causal
  relevance: Supports query/task-aware compression and putting critical content at prompt edges; shows
    compression can be an accuracy tool, not just a cost tool.
  generalizes_across_models: partial
  confidence: high
  verification_status: verified-primary
- id: S-A03
  title: 'LLMLingua-2: Data Distillation for Efficient and Faithful Task-Agnostic Prompt Compression'
  authors: Zhuoshi Pan et al. (Tsinghua + Microsoft)
  venue: Findings of ACL 2024; arXiv
  year: 2024
  url: https://arxiv.org/abs/2403.12968
  arxiv_id: '2403.12968'
  doi: 10.48550/arXiv.2403.12968
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: Can task-agnostic compression be made faithful and fast by learning token importance
    from GPT-4-distilled data instead of causal-LM entropy?
  setup: Extractive compression dataset distilled from an LLM; compression framed as token classification
    with a bidirectional encoder (XLM-RoBERTa-large); evaluated in-domain (MeetingBank) and out-of-domain
    (LongBench, ZeroScrolls, GSM8K, BBH).
  main_findings: Bidirectional token-classification compression outperforms entropy-based (unidirectional)
    baselines and stays faithful (extractive — keeps original tokens, so no hallucinated content); small
    encoder makes it cheap enough to run everywhere.
  quantitative_results: 3x-6x faster than existing prompt-compression methods; 1.6x-2.9x end-to-end latency
    speedup at 2x-5x compression ratios; 'significant gains over strong baselines' incl. OOD (stated in
    arXiv abstract).
  limitations: Practical ratios are moderate (2x-5x), well below LLMLingua's 20x claims; extractive-only
    — cannot abstract/reword; training data distilled from one teacher LLM.
  evidence_nature: causal
  relevance: Best current default for compressing reusable skill text offline (task-agnostic, faithful,
    cheap); its 2x-5x sweet spot is a realistic compression-budget ceiling for optimization rules.
  generalizes_across_models: true
  confidence: high
  verification_status: verified-primary
- id: S-A04
  title: Learning to Compress Prompts with Gist Tokens
  authors: Jesse Mu, Xiang Lisa Li, Noah Goodman (Stanford)
  venue: NeurIPS 2023; arXiv
  year: 2023
  url: https://arxiv.org/abs/2304.08467
  arxiv_id: '2304.08467'
  doi: 10.48550/arXiv.2304.08467
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: Can a model be trained to compress instructions into a few cacheable 'gist' tokens,
    amortizing repeated prompt encoding?
  setup: 'Attention-mask modification during instruction finetuning (no extra training cost); models:
    LLaMA-7B (decoder) and FLAN-T5-XXL (encoder-decoder).'
  main_findings: Instructions can be condensed into reusable soft tokens ('gisting') and cached; the foundational
    soft-prompt-compression result for repeated system/skill instructions.
  quantitative_results: Up to 26x prompt compression; up to 40% FLOPs reduction; 4.2% wall-time speedup;
    'minimal loss in output quality' (all stated in arXiv abstract).
  limitations: Requires training the target model itself (not applicable to closed API models); 'minimal'
    quality loss is not zero and is not quantified in the abstract; gist tokens are model-specific.
  evidence_nature: causal
  relevance: The archetype for caching a skill's fixed instructions as compressed state; motivates separating
    a skill's static core (compressible/cacheable) from its dynamic arguments.
  generalizes_across_models: false
  confidence: high
  verification_status: verified-primary
- id: S-A05
  title: '500xCompressor: Generalized Prompt Compression for Large Language Models'
  authors: Zongqian Li, Yixuan Su, Nigel Collier (University of Cambridge)
  venue: ACL 2025 (main, per ACL Anthology 2025.acl-long.1219); arXiv
  year: 2025
  url: https://arxiv.org/abs/2408.03094
  arxiv_id: '2408.03094'
  doi: 10.48550/arXiv.2408.03094
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: What is the upper limit of prompt compression — can whole contexts be packed into
    as little as one special token, and how much capability survives?
  setup: KV-values of learned compressed tokens fed to a frozen decoder (~0.3% added params); pretrained
    on Arxiv Corpus, finetuned on ArxivQA, evaluated on strictly unseen QA datasets.
  main_findings: Extreme soft compression (6x-480x) is possible without finetuning the target LLM; KV-values
    preserve information better than embedding vectors at high ratios; but capability retention drops
    substantially at the extreme end.
  quantitative_results: Compression ratios 6x-480x; ~0.3% additional parameters; LLM retains 62.26%-72.89%
    of its capability vs non-compressed prompts (all stated in arXiv abstract).
  limitations: The headline retention numbers mean 27%-38% capability LOSS — extreme compression is far
    from free; QA-centric evaluation; trained per target model family.
  evidence_nature: causal
  relevance: 'Quantifies the ceiling: beyond ~an order of magnitude, compression costs real accuracy.
    Supports a hard cap rule on compression aggressiveness for skills whose correctness matters.'
  generalizes_across_models: partial
  confidence: high
  verification_status: verified-primary
- id: S-A06
  title: 'Prompt Compression for Large Language Models: A Survey'
  authors: Zongqian Li, Yinhong Liu, Yixuan Su, Nigel Collier (University of Cambridge)
  venue: NAACL 2025 (main, oral — per project repo/anthology listing); arXiv
  year: 2025
  url: https://arxiv.org/abs/2410.12388
  arxiv_id: '2410.12388'
  doi: 10.48550/arXiv.2410.12388
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: How do existing prompt compression methods (hard vs soft) compare mechanically, and
    where are the field's gaps?
  setup: 'Secondary source: taxonomy of hard-prompt methods (token dropping/extraction/abstraction) vs
    soft-prompt methods (gist/memory tokens), analyzed via attention optimization, PEFT, modality integration,
    and ''new synthetic language'' lenses.'
  main_findings: 'Field converges on two families: hard (interpretable, model-agnostic, moderate ratios)
    vs soft (opaque, model-specific, high ratios); open problems include encoder optimization and hybrid
    hard-soft approaches.'
  quantitative_results: None stated in abstract.
  limitations: Survey — no new experimental evidence; evidence quality inherits from the primary studies
    it aggregates (marked correlational for this reason); snapshot as of late 2024.
  evidence_nature: correlational
  relevance: 'The decision map for choosing a compression family per skill type: hard/extractive for portability
    and auditability, soft for high-ratio caching of static instructions on owned models.'
  generalizes_across_models: true
  confidence: high
  verification_status: verified-primary
- id: S-A07
  title: Characterizing Prompt Compression Methods for Long Context Inference
  authors: Siddharth Jha, Lutfi Eren Erdogan, Sehoon Kim, Kurt Keutzer, Amir Gholami (UC Berkeley)
  venue: Es-FoMo workshop @ ICML 2024; arXiv
  year: 2024
  url: https://arxiv.org/abs/2407.08892
  arxiv_id: '2407.08892'
  doi: 10.48550/arXiv.2407.08892
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: preprint
  research_question: 'Standardized head-to-head: which compression family (extractive, abstractive/summarization,
    token pruning) degrades least across tasks?'
  setup: Systematic comparison of extractive compression, summarization-based abstractive compression,
    and token-pruning methods across multiple long-context tasks.
  main_findings: Extractive compression often outperforms all other approaches; token-pruning methods
    lag behind extractive despite recent claims, with only marginal wins on summarization tasks.
  quantitative_results: Extractive compression enables up to 10x compression with minimal accuracy degradation
    (stated in arXiv abstract).
  limitations: Workshop paper (lighter review); long-context/QA-flavored tasks — instruction-following
    and safety behaviors not directly measured.
  evidence_nature: causal
  relevance: 'Directly ranks compression families: prefer extractive over pruning or abstractive rewriting
    when optimizing skill text — and treat ~10x as the empirical safe-zone boundary.'
  generalizes_across_models: partial
  confidence: medium
  verification_status: verified-primary
- id: S-A08
  title: Understanding and Improving Information Preservation in Prompt Compression for LLMs
  authors: Weronika Łajewska et al. (AWS AI Labs collaboration)
  venue: Findings of EMNLP 2025; arXiv
  year: 2025
  url: https://arxiv.org/abs/2503.19114
  arxiv_id: '2503.19114'
  doi: 10.48550/arXiv.2503.19114
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: peer-reviewed
  research_question: Do prompt compression methods actually preserve the information that matters — beyond
    raw task accuracy?
  setup: Holistic evaluation framework scoring compression on (i) downstream task performance, (ii) grounding
    in the input context, (iii) information preservation (e.g., entity retention), applied to SOTA hard
    and soft compression methods.
  main_findings: Some state-of-the-art compressors fail to preserve key details of the original prompt,
    which caps performance on complex tasks; controlling compression granularity substantially repairs
    a soft-prompt method.
  quantitative_results: Granularity-controlled soft prompting yields up to +23% downstream performance,
    +8 BERTScore points in grounding, and 2.7x more entities preserved (stated in arXiv abstract).
  limitations: Improvement demonstrated on one soft method; abstract does not name which SOTA methods
    fail or by how much per task.
  evidence_nature: causal
  relevance: Argues optimization rules must gate on information-preservation metrics (entities, grounding),
    not only end-task accuracy — silent detail loss is the failure mode of naive compression.
  generalizes_across_models: partial
  confidence: high
  verification_status: verified-primary
- id: S-A09
  title: 'When Compression Becomes an Attack Surface: Black-Box Attacks on Prompt-Compressed LLM Agents
    (formerly ''CompressionAttack'')'
  authors: Zesen Liu, Zhixiang Zhang, Yuchong Xie, Dongdong She (HKUST)
  venue: arXiv (cs.CR / cs.AI); v4 2026-06-19
  year: 2025
  url: https://arxiv.org/abs/2510.22963
  arxiv_id: '2510.22963'
  doi: 10.48550/arXiv.2510.22963
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: preprint
  research_question: Does deploying a prompt compressor in an LLM agent create a new attack surface —
    can adversarial pre-compression perturbations make the compressor drop safety guardrails or task-critical
    evidence?
  setup: Formalizes 'adversarial information loss' (AIL); COMA, a transfer-based black-box attack using
    surrogate compressors/LLMs; evaluated across 3 tasks and 6 compressors, plus 2 real-world agent case
    studies.
  main_findings: When trusted and untrusted inputs share one compression budget, perturbing only untrusted
    inputs can steer the compressor to discard safety guardrails or key evidence BEFORE the LLM ever sees
    them — the compressor, not the LLM, is the target.
  quantitative_results: COMA achieves 0.71 average attack success rate vs 0.21 for the strongest baseline,
    across 3 tasks and 6 compressors (stated in arXiv abstract).
  limitations: Not yet peer-reviewed (multiple arXiv revisions incl. a retitle at v4); attack-side evaluation
    — defenses only sketched; agent case studies limited to two.
  evidence_nature: causal
  relevance: 'Direct evidence that compression erodes safety instructions under adversarial input: optimization
    rules must exempt safety/policy text from shared compression budgets and never co-compress trusted
    instructions with untrusted content.'
  generalizes_across_models: partial
  confidence: medium
  verification_status: verified-primary
- id: S-A10
  title: 'Separating Constraint Compliance from Semantic Accuracy: A Novel Benchmark for Evaluating Instruction-Following
    Under Compression'
  authors: Rahul Baxi
  venue: arXiv (under review at TMLR per abstract page)
  year: 2025
  url: https://arxiv.org/abs/2512.17920
  arxiv_id: '2512.17920'
  doi: 10.48550/arXiv.2512.17920
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: preprint
  research_question: When prompts are compressed, is degradation driven by losing semantic content or
    by dropping constraints/instructions — and how does it vary with compression level?
  setup: 'Compression-Decay Comprehension Test (CDCT): 9 frontier LLMs x 8 concepts x 5 compression levels
    (c=0.0 ~2 words to c=1.0 ~135 words); 3-judge LLM jury (Fleiss'' kappa=0.90 on constraint compliance).'
  main_findings: 'Constraint compliance follows a U-curve: violations PEAK at medium compression (c=0.5)
    — mid-length prompts are the danger zone, worse than either extreme; constraint compliance and semantic
    accuracy are statistically orthogonal dimensions.'
  quantitative_results: U-curve prevalence 97.2%; violations peak at c=0.5 (~27 words); dimensions orthogonal
    (r=0.193, p=0.084); constraint effects 2.9x larger than semantic effects; RLHF 'helpfulness' ablation
    improves constraint compliance +598% on average (71/72 trials, p<0.001); reasoning models beat efficient
    models by 27.5% (Cohen's d=0.96) (all stated in arXiv abstract).
  limitations: Single-author preprint, unreplicated, still under review; LLM-judge-based scoring; tiny
    prompts (2-135 words) — regime differs from long-context compression; striking effect sizes (+598%)
    await independent confirmation.
  evidence_nature: causal
  relevance: Warns that moderate shortening — the optimizer's most tempting operation — is where instruction/constraint
    dropping peaks; compliance must be tested per compression level, not assumed monotonic.
  generalizes_across_models: partial
  confidence: low
  verification_status: verified-primary
- id: S-B01
  title: 'Lost in the Middle: How Language Models Use Long Contexts'
  authors: Nelson F. Liu, Kevin Lin, John Hewitt, Ashwin Paranjape, Michele Bevilacqua, Fabio Petroni,
    Percy Liang
  venue: Transactions of the Association for Computational Linguistics (TACL), vol. 12 (ACL Anthology
    2024.tacl-1.9); arXiv v1 2023-07-06, v3 2023-11-20
  year: 2024
  url: https://arxiv.org/abs/2307.03172
  arxiv_id: '2307.03172'
  doi: 10.48550/arXiv.2307.03172
  date_accessed: '2026-07-24'
  access_method: webfetch-fulltext
  source_type: peer-reviewed-journal
  research_question: 'How robustly do LLMs use information at different positions within a long input
    context, on tasks that require finding relevant information inside the context?

    '
  setup: 'Controlled position-manipulation experiments on two tasks: multi-document QA (NaturalQuestions-based,
    10/20/30 retrieved documents, the gold document moved systematically across positions) and synthetic
    key-value retrieval. Open and closed models tested, including GPT-3.5-Turbo (4K/16K), Claude, and
    explicitly long-context models.

    '
  main_findings: 'Performance is highest when relevant information is at the beginning (primacy) or end
    (recency) of the context and degrades significantly in the middle — a U-shaped position curve. The
    effect persists "even for explicitly long-context models" (abstract). Query-aware contextualization
    (placing the query both before and after the documents) fixes key-value retrieval but not multi-doc
    QA.

    '
  quantitative_results: 'Read in full text (ar5iv, Fig. 5 / sec 2.3 / sec 4.2): with 20 documents, GPT-3.5-Turbo
    accuracy = 75.8% at position 0, 63.2% at the last position, and 53.8% at the middle (index 9); with
    30 documents: 73.4% / 63.7% / 50.9% — a ~22-25 point drop from beginning to middle. Middle-position
    performance falls BELOW the closed-book (no documents) baseline of 56.1%. Key-value retrieval: GPT-3.5-Turbo
    (16K) worst-case 45.6% without query-aware contextualization, perfect with it (300 key-value pairs).

    '
  limitations: 'Models are 2023-era (GPT-3.5/4, Claude 1.x, MPT, LongChat); absolute numbers are dated
    even though the positional effect has been reproduced later (see S-B02, S-B03). Mostly extractive
    QA-style tasks, not generation or agentic use.

    '
  evidence_nature: causal
  relevance: 'Foundational for context-layout rules: an optimizer should place task-critical instructions/facts
    at the start or end of the prompt, never buried mid-context, and should treat mid-context tokens as
    low-yield — more context can be worse than none (middle < closed-book).

    '
  generalizes_across_models: yes — U-shape observed across all open and closed models tested, including
    long-context variants (2023-era models; effect replicated by later studies)
  confidence: high
  verification_status: verified-primary
- id: S-B02
  title: 'NoLiMa: Long-Context Evaluation Beyond Literal Matching'
  authors: Ali Modarressi, Hanieh Deilamsalehy, Franck Dernoncourt, Trung Bui, Ryan A. Rossi, Seunghyun
    Yoon, Hinrich Schütze
  venue: ICML 2025 (Adobe Research / LMU); arXiv submitted 2025-02-07, revised 2025-07-09
  year: 2025
  url: https://arxiv.org/abs/2502.05167
  arxiv_id: '2502.05167'
  doi: 10.48550/arXiv.2502.05167
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Does long-context retrieval performance survive when the question and the "needle"
    share minimal lexical overlap, forcing latent associative reasoning instead of literal matching?

    '
  setup: 'Needle-in-a-haystack benchmark where needle-question pairs are linked only by associative/world
    knowledge (minimal lexical overlap), haystacks up to 1M tokens; 13 popular LLMs all claiming >=128K
    context (incl. GPT-4o, Gemini 1.5 Pro, Llama 3.3 70B).

    '
  main_findings: 'Models perform well below 1K tokens but degrade rapidly as context grows — long before
    their claimed context limits — once surface-level lexical matching cannot carry the retrieval. Claimed
    context window size vastly overstates the effective reasoning length.

    '
  quantitative_results: 'Read on arXiv abstract page: at 32K tokens, 11 of 13 models drop below 50% of
    their strong short-context baselines; GPT-4o falls from a 99.3% short-context baseline to 69.7%.

    '
  limitations: 'Synthetic needle-retrieval framing; associative-hop tasks may understate performance on
    naturalistic documents where redundancy helps. Scores are for one needle type; agentic/multi-fact
    settings untested.

    '
  evidence_nature: causal
  relevance: 'Rules out "just rely on the long window" as an optimization strategy: a skill optimizer
    should keep the semantic distance between query terms and stored context small (lexical anchors matter)
    and should not assume content placed deep in a 128K window is usable — effective length is a fraction
    of nominal.

    '
  generalizes_across_models: yes — 13 models across vendors; 11/13 show the same >50% relative drop at
    32K
  confidence: high
  verification_status: verified-primary
- id: S-B03
  title: 'Context Rot: How Increasing Input Tokens Impacts LLM Performance'
  authors: Kelly Hong, Anton Troynikov, Jeff Huber (Chroma)
  venue: Chroma technical report (research.trychroma.com), published 2025-07-14; reproducible (code/tasks
    released)
  year: 2025
  url: https://www.trychroma.com/research/context-rot
  arxiv_id: null
  doi: null
  date_accessed: '2026-07-24'
  access_method: provider-doc
  source_type: technical-report
  research_question: 'Do frontier models process the 10,000th input token as reliably as the 100th — i.e.,
    how does performance change with input length alone, holding task difficulty fixed?

    '
  setup: '18 LLMs across 4 families (Claude Opus 4/Sonnet 4/3.7/3.5/Haiku 3.5; o3, GPT-4.1 family, GPT-4o,
    GPT-4 Turbo, GPT-3.5 Turbo; Gemini 2.5 Pro/Flash, 2.0 Flash; Qwen3 235B/32B/8B). Tasks: extended NIAH
    varying needle-question semantic similarity, distractor count, needle-haystack blending, and haystack
    structure; LongMemEval (conversational QA, focused vs full-history prompt); synthetic repeated-words
    replication.

    '
  main_findings: 'Performance degrades non-uniformly with input length even on trivially simple tasks;
    degradation accelerates when needle-question similarity is low, when distractors are present, and
    in full-history vs focused prompts. Surprisingly, models do better on shuffled haystacks than logically
    structured ones.

    '
  quantitative_results: 'Read on the report page (qualitative statements with per-model plots): low-similarity
    needle-question pairs — "performance degrades more quickly in input length" than high-similarity pairs;
    "even a single distractor reduces performance relative to the baseline"; on LongMemEval, Claude models
    show "the most pronounced gap between focused and full prompt performance"; repeated-words task —
    correct placement more likely when the unique word appears early in the input.

    '
  limitations: 'Vendor-adjacent technical report (Chroma sells retrieval infra), not peer-reviewed; page
    presents plots more than headline numbers; NIAH-style tasks dominate. Methodology and code are public,
    mitigating but not removing the conflict-of-interest concern.

    '
  evidence_nature: causal
  relevance: 'Direct evidence for a "focused-context" rule: passing only the relevant slice of history/documents
    beats passing everything, across 18 recent models; also motivates distractor-filtering before context
    assembly (a single hard distractor already costs accuracy).

    '
  generalizes_across_models: yes — 18 models, 4 vendors, consistent direction (magnitudes differ by family;
    Claude most sensitive to full-history prompts on LongMemEval)
  confidence: medium
  verification_status: verified-primary
- id: S-B04
  title: Context Length Alone Hurts LLM Performance Despite Perfect Retrieval
  authors: Yufeng Du, Minyang Tian, Srikanth Ronanki, Subendhu Rongali, Sravan Bodapati, Aram Galstyan,
    Azton Wells, Roy Schwartz, Eliu A. Huerta, Hao Peng
  venue: Findings of EMNLP 2025; arXiv submitted 2025-10-06
  year: 2025
  url: https://arxiv.org/abs/2510.05381
  arxiv_id: '2510.05381'
  doi: 10.48550/arXiv.2510.05381
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Is long-context failure explained by retrieval/distraction, or does input length
    per se degrade performance even when the model attends only to the relevant tokens?

    '
  setup: '5 open- and closed-source LLMs on math, QA, and coding tasks; input length is manipulated with
    padding while the relevant information stays fixed and retrievable; includes conditions where irrelevant
    tokens are masked so the model is forced to attend only to relevant ones.

    '
  main_findings: 'Performance declines substantially as input grows even when models can perfectly retrieve
    all relevant information, and the degradation persists when irrelevant tokens are masked — length
    itself, independent of distraction or retrieval quality, impairs performance.

    '
  quantitative_results: 'Read on arXiv abstract page: performance declines 13.9%–85% as input length increases
    despite perfect retrieval; a proposed mitigation gives a consistent improvement of up to 4% for GPT-4o
    on the RULER benchmark.

    '
  limitations: '5 models only; padding-based length manipulation is synthetic; the wide 13.9%–85% range
    means the effect size is highly model/task dependent; mitigation gain (<=4%) is modest relative to
    the losses.

    '
  evidence_nature: causal
  relevance: 'The strongest justification for token-count minimization as a first-class objective: even
    perfectly relevant-only pipelines pay a length tax, so an optimizer should cut total tokens, not merely
    improve relevance ranking. Caveat it also implies: pruning distractors alone is NOT sufficient to
    recover accuracy.

    '
  generalizes_across_models: partial — 5 models, consistent direction but very wide magnitude range (13.9%–85%)
  confidence: high
  verification_status: verified-primary
- id: S-B05
  title: LLMs Get Lost In Multi-Turn Conversation
  authors: Philippe Laban, Hiroaki Hayashi, Yingbo Zhou, Jennifer Neville (Microsoft Research / Salesforce)
  venue: 'arXiv preprint (Microsoft code release: microsoft/lost_in_conversation); submitted 2025-05-09'
  year: 2025
  url: https://arxiv.org/abs/2505.06120
  arxiv_id: '2505.06120'
  doi: 10.48550/arXiv.2505.06120
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: arxiv-preprint
  research_question: 'How much does LLM task performance change when a fully-specified single-turn instruction
    is instead revealed gradually ("sharded") across an underspecified multi-turn conversation?

    '
  setup: 'Large-scale simulation: 200,000+ simulated conversations comparing single-turn vs multi-turn
    delivery of the same instructions, across six generation tasks, on top open- and closed-weight LLMs;
    performance decomposed into aptitude and reliability.

    '
  main_findings: 'All tested LLMs perform significantly worse in multi-turn, underspecified conversations
    than single-turn: models make early assumptions, prematurely attempt final answers, and over-rely
    on their own previous (possibly wrong) turns — "when LLMs take a wrong turn in a conversation, they
    get lost and do not recover."

    '
  quantitative_results: 'Read on arXiv abstract page: average performance drop of 39% across six generation
    tasks in multi-turn vs single-turn; decomposition attributes it to a minor loss in aptitude and a
    significant increase in unreliability.

    '
  limitations: 'Simulated (LLM-simulated users), not organic conversations; preprint (not yet peer-reviewed
    as fetched); the 39% averages over tasks with varying spread; abstract does not quantify individual
    mitigation strategies.

    '
  evidence_nature: simulated
  relevance: 'Grounds conversation-history rules: accumulated raw history is a liability — an optimizer
    should consolidate scattered turn-by-turn specs into one restated, fully-specified instruction block
    before expensive steps, and should distrust content the model itself generated in earlier (possibly
    wrong) turns when compacting history.

    '
  generalizes_across_models: yes — all top open- and closed-weight LLMs tested show the degradation (average
    39%)
  confidence: medium
  verification_status: verified-primary
- id: S-B06
  title: Compressing Context to Enhance Inference Efficiency of Large Language Models (Selective Context)
  authors: Yucheng Li, Bo Dong, Chenghua Lin, Frank Guerin
  venue: EMNLP 2023 (ACL Anthology 2023.emnlp-main.391); arXiv submitted 2023-10-09
  year: 2023
  url: https://arxiv.org/abs/2310.06201
  arxiv_id: '2310.06201'
  doi: 10.48550/arXiv.2310.06201
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Can input contexts be pruned of redundant content — without model changes — while
    preserving downstream task performance?

    '
  setup: '"Selective Context": rank lexical units by self-information computed with a small causal LM
    and delete low-information spans. Evaluated on arXiv papers, news, and long conversations, over summarization,
    QA, and response generation.

    '
  main_findings: 'Roughly half the context can be pruned with only minor measured quality loss, yielding
    large memory/latency savings; redundancy in natural text is high enough that task-agnostic pruning
    is viable, but the loss is small, not zero.

    '
  quantitative_results: 'Read on arXiv abstract page: 50% reduction in context cost; 36% reduction in
    inference memory; 32% reduction in inference time; quality cost = drop of 0.023 BERTscore and 0.038
    in faithfulness across four downstream applications.

    '
  limitations: 'Task-agnostic (query-blind) pruning: the 0.038 faithfulness drop shows real information
    loss; self-information scoring depends on the small scoring LM; 2023-era evaluation models; aggressive
    ratios beyond 50% not established as safe.

    '
  evidence_nature: causal
  relevance: 'Baseline pruning rule for the optimizer: ~2x token cuts are nearly free, but it quantifies
    the harm side — pruning is NOT lossless (faithfulness suffers measurably), so safety-critical skill
    content should be exempt from task-agnostic pruning.

    '
  generalizes_across_models: partial — method is model-agnostic in principle but validated on a small
    2023 model set; savings replicate, quality cost may vary
  confidence: medium
  verification_status: verified-primary
- id: S-B07
  title: 'LongLLMLingua: Accelerating and Enhancing LLMs in Long Context Scenarios via Prompt Compression'
  authors: Huiqiang Jiang, Qianhui Wu, Xufang Luo, Dongsheng Li, Chin-Yew Lin, Yuqing Yang, Lili Qiu (Microsoft)
  venue: ACL 2024 (ACL Anthology 2024.acl-long.91); arXiv submitted 2023-10-10, revised 2024-08-12
  year: 2024
  url: https://arxiv.org/abs/2310.06839
  arxiv_id: '2310.06839'
  doi: 10.48550/arXiv.2310.06839
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Can question-aware prompt compression plus document reordering simultaneously cut
    cost/latency AND improve accuracy in long-context / RAG scenarios?

    '
  setup: 'Coarse-to-fine, question-aware compression: document-level ranking by question-conditioned perplexity,
    token-level compression with adaptive ratios, plus a document reordering mechanism that exploits the
    positional (lost-in-the-middle) bias; evaluated on NaturalQuestions, LongBench, LooGLE and others
    with GPT-3.5-Turbo.

    '
  main_findings: 'Compression that is aware of the question and of positional bias can beat the uncompressed
    prompt — higher key-information density outperforms more raw tokens; explicitly builds on the finding
    that performance depends on the density AND position of key information.

    '
  quantitative_results: 'Read on arXiv abstract page: up to 21.4% performance boost on NaturalQuestions
    with ~4x fewer tokens (GPT-3.5-Turbo); 94.0% cost reduction on LooGLE; end-to-end latency accelerated
    1.4x–2.6x when compressing ~10K token prompts at 2x–6x ratios.

    '
  limitations: 'Requires an auxiliary small LM at inference time (extra component/latency); headline gains
    measured mainly with GPT-3.5-Turbo-era targets; compression hyperparameters (ratios, reorder) need
    tuning per task; gains shrink when the original prompt is already dense.

    '
  evidence_nature: causal
  relevance: 'The strongest "compression can INCREASE accuracy" datapoint: an optimizer should compress
    query-aware (not query-blind like S-B06) and reorder surviving content so the most relevant items
    sit at positions models actually use — turning S-B01''s positional pathology into a free optimization
    lever.

    '
  generalizes_across_models: partial — principle (density+position) replicated broadly, but reported numbers
    are GPT-3.5-Turbo-centric and depend on the auxiliary compressor
  confidence: high
  verification_status: verified-primary
- id: S-B08
  title: 'RECOMP: Improving Retrieval-Augmented LMs with Compression and Selective Augmentation'
  authors: Fangyuan Xu, Weijia Shi, Eunsol Choi (UT Austin / UW)
  venue: ICLR 2024 (per authors' ICLR'24 poster; arXiv page itself does not name the venue); arXiv submitted
    2023-10-06
  year: 2024
  url: https://arxiv.org/abs/2310.04408
  arxiv_id: '2310.04408'
  doi: 10.48550/arXiv.2310.04408
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Can retrieved documents be compressed into short textual summaries before in-context
    integration without hurting — and sometimes helping — end-task performance?

    '
  setup: 'Two trained compressors over retrieved document sets: extractive (selects useful sentences)
    and abstractive (synthesizes a multi-document summary), both trained end-to-end to maximize the target
    LM''s task performance when the summary is prepended; evaluated on language modeling and open-domain
    QA.

    '
  main_findings: 'Retrieved context can be compressed to a small fraction of its size with minimal performance
    loss; critically, "selective augmentation" — returning an EMPTY summary when retrieval is irrelevant
    or uninformative — is built in, acknowledging that appending bad retrievals hurts. Trained compressors
    significantly outperform off-the-shelf summarizers.

    '
  quantitative_results: 'Read on arXiv abstract page: compression rate as low as 6% (i.e., ~94% of retrieved
    tokens removed) with minimal loss in performance on both language modeling and open-domain QA. (No
    further numbers stated on the abstract page.)

    '
  limitations: 'Compressors are trained per task/target-LM (transfer not guaranteed); abstractive compression
    inherits summarization-hallucination risk; abstract gives no per-dataset accuracy deltas; 2023-era
    retrieval setups.

    '
  evidence_nature: causal
  relevance: 'Template for the optimizer''s retrieved-context stage: (a) compress retrieved material to
    short summaries instead of concatenating top-k chunks, and (b) implement the empty-summary guard —
    when retrieval adds nothing, add NOTHING to the context rather than "best available" chunks.

    '
  generalizes_across_models: partial — concept demonstrated on multiple LMs but compressors are trained
    for specific target models/tasks
  confidence: medium
  verification_status: verified-primary
- id: S-B09
  title: 'The Power of Noise: Redefining Retrieval for RAG Systems'
  authors: Florin Cuconasu, Giovanni Trappolini, Federico Siciliano, Simone Filice, Cesare Campagnano,
    Yoelle Maarek, Nicola Tonellotto, Fabrizio Silvestri
  venue: SIGIR 2024 (DOI 10.1145/3626772.3657834, pp. 719-729); arXiv v1 2024-01-26, v4 2024-05-01
  year: 2024
  url: https://arxiv.org/abs/2401.14887
  arxiv_id: '2401.14887'
  doi: 10.1145/3626772.3657834
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Which properties of retrieved documents (relevant / related-but-irrelevant / random;
    position; count) actually help or hurt the generator in a RAG pipeline?

    '
  setup: 'Controlled injection experiments in a RAG QA pipeline: vary the type (gold, semantically related
    "hard" negatives, random), number, and position of documents in the prompt and measure LLM answer
    accuracy.

    '
  main_findings: 'Related-but-irrelevant documents — exactly what dense retrievers rank highly — are actively
    harmful, while (counterintuitively) random irrelevant documents can IMPROVE accuracy. Retriever "relevance"
    ranking is therefore not aligned with what helps the generator; RAG retrieval needs rethinking around
    the generator''s behavior.

    '
  quantitative_results: 'Read on arXiv abstract page: high-scoring but not-directly-relevant documents
    negatively impact effectiveness; adding random documents in the prompt improves LLM accuracy by up
    to 35%. (Position-of-gold numbers are in the paper body, not stated on the abstract page.)

    '
  limitations: 'The random-noise benefit is fragile: a later SIGIR follow-up titled "The Powerless Noise:
    How Experimental Settings Shape the Reported Power of Noise" (seen in search results; not fetched)
    reports the effect is setting-dependent. Mostly NQ-style QA with 2024-era open models; mechanism unexplained.

    '
  evidence_nature: causal
  relevance: 'Sharpens the distractor rule: the danger to filter is SEMANTICALLY-SIMILAR irrelevant content
    (hard negatives), not noise per se — so dedup/filter thresholds based on embedding similarity alone
    are the wrong instrument; also cautions against assuming a larger top-k of "high-scoring" chunks is
    safer.

    '
  generalizes_across_models: partial — harm from hard negatives replicates broadly (consistent with S-B03);
    the random-noise BENEFIT is setting-dependent per follow-up work
  confidence: medium
  verification_status: verified-primary
- id: S-B10
  title: Is Semantic Chunking Worth the Computational Cost?
  authors: Renyi Qu, Ruixuan Tu, Forrest Sheng Bao
  venue: Findings of NAACL 2025 (ACL Anthology 2025.findings-naacl.114, per Anthology listing); arXiv
    submitted 2024-10-16
  year: 2025
  url: https://arxiv.org/abs/2410.13070
  arxiv_id: '2410.13070'
  doi: 10.48550/arXiv.2410.13070
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: conference-paper
  research_question: 'Does semantic chunking (splitting documents at semantic-similarity boundaries) actually
    outperform simple fixed-size chunking enough to justify its computational cost in RAG?

    '
  setup: 'Systematic comparison of semantic chunkers vs fixed-size chunking across three retrieval-related
    tasks: document retrieval, evidence retrieval, and retrieval-based answer generation.

    '
  main_findings: '"The computational costs associated with semantic chunking are not justified by consistent
    performance gains" (abstract) — gains over fixed-size chunking are inconsistent and corpus-dependent,
    challenging a widely-assumed RAG best practice.

    '
  quantitative_results: 'Read on arXiv abstract page: the abstract states the conclusion qualitatively
    and contains no headline numbers; per-task tables are in the paper body (not fetched). Recorded here
    as a directional, replicated negative result.

    '
  limitations: 'Abstract-level verification only (no effect sizes captured); results depend on corpus
    semantic structure — corpora with strong topic shifts may still benefit; evaluates retrieval quality,
    not end-to-end token cost of the whole pipeline.

    '
  evidence_nature: causal
  relevance: 'Default-configuration rule: the optimizer should default to cheap fixed-size (or structure-based)
    chunking and demand measured evidence before paying for semantic chunking — an example of "expensive
    preprocessing does not automatically buy accuracy."

    '
  generalizes_across_models: partial — retriever/corpus-dependent; finding is about the chunking stage,
    largely independent of the generator model
  confidence: medium
  verification_status: verified-primary
- id: S-C01
  title: Prompt caching (Anthropic official documentation)
  authors: Anthropic
  venue: Claude Developer Platform docs (platform.claude.com)
  year: 2026
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  arxiv_id: null
  doi: null
  date_accessed: '2026-07-24'
  access_method: provider-doc
  source_type: provider-doc
  research_question: How does Anthropic's prompt caching work, what does it cost, and what are the prefix-stability
    requirements?
  setup: Official feature documentation for the Messages API cache_control mechanism (explicit breakpoints
    + top-level automatic caching).
  main_findings: 'Caching is a strict prefix match. Cache prefixes are created in the order tools -> system
    -> messages; a change at any level invalidates that level and all subsequent levels. Up to 4 cache
    breakpoints per request. Default TTL is 5 minutes; an optional 1-hour TTL exists via cache_control
    {type: ephemeral, ttl: "1h"}. Minimum cacheable prompt length is model-dependent (512 / 1,024 / 2,048
    / 4,096 tokens); shorter prefixes silently do not cache. Toggles like tool_choice, images, and thinking
    parameters invalidate messages-level (or model-specific) cache tiers while preserving the tools cache;
    changing tool definitions invalidates everything.

    '
  quantitative_results: 'Verbatim multipliers (pricing table on the page): 5-minute cache writes = "1.25
    times the base input tokens price"; 1-hour cache writes = "2 times the base input tokens price"; cache
    read tokens (hits & refreshes) = "0.1 times the base input tokens price". Worked example given for
    Claude Opus 5: base input $5/MTok, 5m cache writes $6.25/MTok, 1h cache writes $10/MTok, cache hits
    & refreshes $0.50/MTok. Minimum cacheable prefix: 512 tokens (Claude Opus 5, Claude Fable 5, Claude
    Mythos 5); 1,024 tokens (Claude Opus 4.8, Claude Sonnet 5, Claude Sonnet 4.6, Claude Sonnet 4.5, Claude
    Opus 4.1, Claude Opus 4); 2,048 tokens (Claude Mythos Preview, Claude Opus 4.7, Claude Haiku 3.5);
    4,096 tokens (Claude Opus 4.6, Claude Opus 4.5, Claude Haiku 4.5). Max 4 breakpoints per request.

    '
  limitations: Vendor documentation, not peer-reviewed; numbers can change at any time; caches are model-scoped
    so any model switch is a full cache rebuild.
  evidence_nature: Authoritative provider specification (normative, not empirical).
  relevance: Directly defines the cache-write/cache-read cost model and the prefix-stability constraints
    any token-efficient skill/prompt layout must satisfy.
  generalizes_across_models: Multipliers uniform across Claude models; minimum cacheable prefix and thinking/effort
    invalidation behavior are model-specific.
  confidence: high
  verification_status: verified-primary
- id: S-C02
  title: Pricing (Anthropic official pricing page)
  authors: Anthropic
  venue: Claude Developer Platform docs (platform.claude.com)
  year: 2026
  url: https://platform.claude.com/docs/en/about-claude/pricing
