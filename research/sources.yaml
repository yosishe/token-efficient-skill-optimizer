- id: S-C05
  title: 'FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance'
  authors: Lingjiao Chen, Matei Zaharia, James Zou
  venue: arXiv preprint (Stanford)
  year: 2023
  url: https://arxiv.org/abs/2305.05176
  arxiv_id: '2305.05176'
  doi: null
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: paper
  research_question: Can strategically combining multiple LLM APIs match top-model quality at a fraction
    of the cost?
  setup: Proposes three strategy families — prompt adaptation, LLM approximation (incl. completion caching),
    and LLM cascade — and implements FrugalGPT, a learned cascade that queries cheaper APIs first and
    escalates only when a scorer deems the answer unreliable.
  main_findings: 'A learned cascade over commercial LLM APIs can match or exceed the best single model''s
    accuracy while dramatically cutting spend; caching and prompt adaptation compose with cascading. Foundational
    paper for the cost/quality-frontier framing used by all later routing work.

    '
  quantitative_results: 'Verbatim claims: FrugalGPT can "match the performance of the best individual
    LLM (e.g. GPT-4) with up to 98% cost reduction" or "improve the accuracy over GPT-4 by 4% with the
    same cost" (on the evaluated benchmarks).

    '
  limitations: 2023-era model lineup and prices; per-task scorer must be trained; headline 98% is best-case
    on specific benchmarks; cascades add latency (multiple sequential calls on escalation).
  evidence_nature: Empirical benchmark study (preprint; widely cited).
  relevance: Canonical justification for a cheap-model-first cascade rule in the optimizer; its scorer-then-escalate
    pattern is the template for a quality gate.
  generalizes_across_models: Framework is model-agnostic; exact savings depend on current price ratios
    and task difficulty mix.
  confidence: high
  verification_status: verified-primary
- id: S-C06
  title: 'RouteLLM: Learning to Route LLMs with Preference Data'
  authors: Isaac Ong, Amjad Almahairi, Vincent Wu, Wei-Lin Chiang, Tianhao Wu, Joseph E. Gonzalez, M Waleed
    Kadous, Ion Stoica
  venue: arXiv preprint (v1 2024-06-26; v4 2025-02-23); LMSYS / UC Berkeley
  year: 2024
  url: https://arxiv.org/abs/2406.18665
  arxiv_id: '2406.18665'
  doi: null
  date_accessed: '2026-07-24'
  access_method: webfetch-abstract
  source_type: paper
  research_question: Can a router trained on human preference data decide per-query between a strong and
    a weak LLM without quality loss?
  setup: Trains router models on Chatbot-Arena human preference data plus data augmentation; router dynamically
    selects between a stronger and a weaker LLM at inference time.
  main_findings: 'Preference-trained routers optimize the cost/quality balance per query and — critically
    for a config-driven optimizer — show "significant transfer learning capabilities": they keep working
    when the underlying strong/weak model pair is swapped at test time.

    '
