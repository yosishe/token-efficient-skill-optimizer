- id: S-D09
  title: Effective context engineering for AI agents
  authors: Anthropic (engineering blog)
  venue: Anthropic Engineering blog
  year: 2025
  url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  arxiv_id: null
  doi: null
  date_accessed: '2026-07-24'
  access_method: webfetch-fulltext
  source_type: engineering-report
  research_question: How should agent context be curated so a finite attention budget is spent on high-signal
    tokens?
  setup: 'Practitioner synthesis: ''context rot'' (performance degrades as context grows; attention strained
    by n^2 pairwise token relationships), with techniques — minimal high-signal system prompts, just-in-time
    retrieval via lightweight identifiers, compaction, structured note-taking/external memory, and sub-agent
    architectures returning condensed summaries.'
  main_findings: Goal is 'the smallest possible set of high-signal tokens that maximize the likelihood
    of some desired outcome'; prefer progressive disclosure (agents incrementally discover context through
    exploration) over pre-loading everything; use compaction and external notes for long horizons.
  quantitative_results: 'One illustrative figure in the post: sub-agents may explore tens of thousands
    of tokens but should return only ~1,000-2,000-token summaries. No controlled measurements.'
  limitations: No experiments; 'context rot' magnitude unquantified in the post; Claude-centric.
  evidence_nature: anecdotal (practitioner synthesis)
  relevance: 'The optimizer''s north-star framing: every skill/system-prompt token competes for attention
    budget, so trimming low-signal instruction text is a quality intervention, not just a cost one; also
    motivates load-on-demand references over inline content.'
