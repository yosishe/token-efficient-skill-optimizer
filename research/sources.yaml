  source_type: preprint
  research_question: Which agent architectures give principled (not heuristic) resistance to prompt injection
    while preserving utility?
  setup: Proposes and systematically analyzes a set of design patterns for injection-resistant agents
    (e.g., constraining what untrusted content can influence), with utility/security tradeoff analysis
    and real-world case studies.
  main_findings: Security against injection should come from structural constraints on agent design —
    once an agent ingests untrusted input, its subsequent actions must be restricted — rather than from
    model-level filtering alone; each pattern trades some generality/utility for provable resistance.
  quantitative_results: None in the abstract — contribution is architectural patterns and case-study analysis,
    not benchmark numbers.
  limitations: Abstract-only verification; patterns constrain agent capability (utility cost); 'provable
    resistance' applies within each pattern's threat-model assumptions.
  evidence_nature: anecdotal (principled design analysis + case studies, not controlled experiments)
  relevance: 'Gives the optimizer its concrete defensive playbook: process skill/document content under
    restricted privileges, don''t let text from the optimized artifact steer tool use, and design the
    optimization loop so untrusted content can affect only quarantined outputs.'
  generalizes_across_models: yes — architectural patterns are model-agnostic by construction
  confidence: high
  verification_status: verified-primary
cluster_syntheses:
  cluster-A-compression-safety: 'Consensus: moderate, extractive/task-aware compression (roughly 2x-5x
    task-agnostic [S-A03], up to ~10x extractive [S-A07], ~20x claimed in the best case [S-A01]) preserves
    most task accuracy, and question-aware compression can even IMPROVE long-context accuracy by densifying
    relevant information [S-A02]. Soft-prompt methods [S-A04, S-A05] reach far higher ratios but are model-specific
    and opaque.

    Disagreements: (a) how lossy high-ratio compression really is — "little performance loss at 20x" [S-A01]
    vs 27-38% capability loss at extreme ratios [S-A05] and silent entity/grounding loss even in SOTA
    methods [S-A08]; (b) token pruning''s value — its papers'' claims vs S-A07''s finding that it lags
    extractive; (c) whether degradation is semantic or instructional — S-A10 says constraint-dropping
    dominates (2.9x) and is non-monotonic, which no other source models.

    Candidate rule R1 — Budget cap: default skill-text compression to extractive methods at <=5x, hard
    ceiling ~10x; beyond that require explicit accuracy sign-off. Support: S-A01, S-A03, S-A07. Risk:
    S-A05''s measured 27-38% loss at extreme ratios; S-A08''s silent information loss.

    Candidate rule R2 — Protect instructions and safety text: never compress constraints/safety instructions
    in the same budget as content; keep them verbatim (or restore post-compression) and never co-compress
    trusted instructions with untrusted input. Support: S-A09 (guardrail-dropping attack, ASR 0.71), S-A10
    (constraint violations peak at mid compression), S-A01 (budget controller precedent).

    Candidate rule R3 — Task-aware over generic: when the query/task is known, use question-aware compression
    + reordering (can gain accuracy, +21.4% NQ at 4x fewer tokens); when compressing reusable skill text
    offline, use faithful task-agnostic token classification (LLMLingua-2-style). Support: S-A02, S-A03,
    S-A06.

    Candidate rule R4 — Verify preservation, not just accuracy: gate every compressed skill version on
    information-preservation checks (entity retention, grounding) and per-compression-level constraint-compliance
    tests, since compliance decay is U-shaped, not monotonic. Support: S-A08, S-A10; risk: S-A10 is unreplicated
    (low confidence), so treat the U-curve as a hypothesis to test in-house.

    Overall evidence caveat: quality-degradation evidence is strong and peer-reviewed; safety-specific
    erosion evidence [S-A09, S-A10] is newer and preprint-only — real but less settled.

    '
  cluster-B-context-rag: 'CONSENSUS: (1) Accuracy degrades with input length long before nominal window
    limits — across 18 models (S-B03), 13 models (S-B02: 11/13 below 50% of baseline at 32K), and even
    with PERFECT retrieval and masked irrelevant tokens (S-B04: 13.9%-85% drops) — so token count itself
    is a cost, not just noise. (2) Position matters: mid-context information can be worth less than no
    context at all (S-B01: middle 53.8% < closed-book 56.1%). (3) Query-aware compression of context is
    cheap and can even raise accuracy (S-B07: +21.4% with 4x fewer tokens; S-B08: 6% compression rate
    with minimal loss), while semantically-similar-but-irrelevant content reliably hurts (S-B03, S-B09).
    DISAGREEMENTS: random noise sometimes HELPS (+35%, S-B09) while any hard distractor hurts (S-B03)
    — the harmful variable is semantic similarity, not token count of junk, and the noise benefit is setting-dependent;
    S-B03 also finds shuffled haystacks beat structured ones, complicating "coherent context is better"
    intuitions; semantic chunking underdelivers vs its reputation (S-B10). CANDIDATE RULES: R1 — enforce
    a token budget and prefer the focused slice over full history/top-k dumps (S-B03, S-B04, S-B05); risk:
    S-B04 shows even relevant-only long prompts degrade, so budget, don''t just filter. R2 — compress
    retrieved/skill context QUERY-AWARE with reordering so key items sit at start/end (S-B07, S-B01, S-B08);
    risk: query-blind pruning measurably hurts faithfulness (S-B06: -0.038) and abstractive compression
    can hallucinate — exempt safety-critical instructions from pruning. R3 — filter hard negatives (high
    embedding-similarity, non-answering chunks) rather than deduplicating by similarity alone, and add
    NOTHING when retrieval is uninformative (S-B09, S-B08, S-B03). R4 — for multi-turn skills, periodically
    consolidate the conversation into one restated fully-specified spec instead of growing raw history
    (S-B05: -39% multi-turn; S-B03 LongMemEval focused>full); risk: summarization is lossy and models
    don''t recover from a wrong compacted premise (S-B05) — keep an escape hatch to the raw log.

    '
  cluster-C-caching-routing-pricing: 'Consensus: both major providers now price cache reads at 0.1x input
    and (on their newest

    families) cache writes at 1.25x input, and both make the same architectural demand — a

    byte-stable prefix with static content first — so stable-prefix skill layout is a

    provider-agnostic optimization, mechanistically grounded by KV-reuse systems work

    (S-C07 8-60x TTFT, S-C08 6.4x throughput). Routing/cascade literature consistently finds

    large savings at held quality: 98% best-case (FrugalGPT), >2x (RouteLLM), >50% (AutoMix).

    Disagreements: control surface (Anthropic explicit cache_control breakpoints + TTL choice

    vs OpenAI fully automatic, no TTL control); write billing history (OpenAI pre-5.6 free

    writes vs Anthropic always-charged); minimum cacheable prefix (OpenAI flat 1024 vs

    Anthropic 512-4096 by model); and routing savings magnitude, which tracks how much

    verification overhead each scheme pays up front.

    Candidate optimization rules:

    R-C1 stable-prefix layout — order skill content tools->system->messages, static-first,

    no timestamps/UUIDs/non-deterministic serialization in the prefix; risk: a single silent

    invalidator voids all downstream cache (verify via cache_read_input_tokens > 0).

    R-C2 cache-write-tier selection — choose 5m vs 1h TTL from expected re-invocation

    interval; 5m breaks even after 1 read, 1h after 2 (S-C02 verbatim); risk: 2x writes on

    bursty low-reuse traffic; also gate on the per-model minimum cacheable prefix.

    R-C3 difficulty-based routing/cascade — cheap model + self-verify, escalate on low

    confidence (AutoMix), or preference-trained router (RouteLLM); risk: quality loss on

    misrouted hard queries and router miscalibration after model/price churn — require a

    quality gate and periodic recalibration against the pricing_snapshot.

    R-C4 semantic response cache above the provider prefix cache (GPTCache) for repeated

    queries — the only tier that also saves output tokens; risk: false-positive similarity

    hits serving wrong/stale answers — require conservative thresholds and staleness TTLs.

    '
  cluster-D-output-agents-injection: "Consensus: (1) Reasoning/output verbosity is heavily compressible\
    \ — terse-reasoning prompting and token budgets\ncut output tokens dramatically (up to ~92% in CoD's\
    \ best case) at near-equal accuracy on standard benchmarks\n(S-D01, S-D02, S-D03); (2) token spend,\
    \ not architecture cleverness, dominates agent cost-performance (S-D07:\ntoken usage explains ~80%\
    \ of eval variance); (3) context is a finite attention budget — minimal high-signal\nprompts + progressive\
    \ disclosure beat pre-loading (S-D09, S-D10); (4) any text an LLM ingests is an instruction\nchannel,\
    \ so skill/tool/document content must be handled as untrusted (S-D11, S-D12).\nDisagreements/tensions:\
    \ strict output-format constraints measurably hurt reasoning (S-D04) yet structured output\nreduces\
    \ parse failures/retries — the economics depend on constraint strictness (magnitude contested by the\n\
    dottxt rebuttal, unverified here); multi-agent gives +90.2% on parallelizable research but at ~15x\
    \ tokens\n(S-D07) vs the simplicity-first default (S-D08); conciseness pressure risks accuracy loss\
    \ on hardest instances\n(S-D01/S-D02 report 'slight' degradation; S-D05 shows the mirror risk, Premature\
    \ Disengagement, when agents\nunder-deliberate).\nCandidate optimization rules:\nR1 Budgeted terse\
    \ reasoning — add explicit output-token budgets / draft-style reasoning instructions to skills\n \
    \  (S-D01, S-D02, S-D03); risk: accuracy drop on hard problems, budgets must scale with difficulty\
    \ (S-D02).\nR2 Loosest-schema principle — request the minimal structure that still parses; reason\
    \ free-form then format\n   (S-D04); risk: looser formats raise parse/retry costs — measure both sides.\n\
    R3 Plan-and-batch tool calls + effort scaling — batch independent calls in one turn, cap tool calls\
    \ per task\n   tier ('simple fact-finding = 1 agent, 3-10 calls') (S-D06, S-D07); risk: upfront plans\
    \ fail on tasks needing\n   observation-dependent branching.\nR4 Single-agent default, progressive\
    \ disclosure — recommend multi-agent only for parallelizable high-value\n   tasks (15x token cost,\
    \ S-D07/S-D08); keep skill metadata minimal, push detail to on-demand files, replace\n   generative\
    \ steps with scripts (S-D09, S-D10); risk: over-trimming removes context the model actually needed.\n\
    R5 Anti-overthinking + untrusted-content gates — penalize long deliberation between actions in agent\
    \ loops\n   (~30% gain / 43% cost cut from selecting low-overthinking solutions, S-D05), and treat\
    \ every optimized-target\n   document/skill body as untrusted input processed under restricted privileges\
    \ (S-D11, S-D12); risk: pushing\n   act-over-think too far causes rogue actions/premature disengagement\
    \ (S-D05).\n"
