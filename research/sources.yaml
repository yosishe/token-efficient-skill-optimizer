  setup: Official per-model pricing table (USD per MTok) including cache columns, Batch API rates, fast-mode
    premiums, and modifier stacking rules.
  main_findings: 'Full per-model table with columns: Base Input Tokens / 5m Cache Writes / 1h Cache Writes
    / Cache Hits & Refreshes / Output Tokens (values recorded in pricing_snapshot below). Batch API gives
    a 50% discount on both input and output. Cache multipliers stack with Batch and data-residency modifiers.
    inference_geo: "us" applies a 1.1x multiplier on all token categories (Claude 4.6+). Claude Sonnet
    5 has introductory pricing ($2/$10) through 2026-08-31, then $3/$15. Fast mode (Opus tier) is premium-priced
    ($10/$50 for Opus 5 and Opus 4.8). Claude 4.7+ models use a newer tokenizer producing ~30% more tokens
    for the same text.

    '
  quantitative_results: 'Verbatim (per MTok, USD): Claude Fable 5 $10 in / $12.50 5m-write / $20 1h-write
    / $1 cache-hit / $50 out. Claude Opus 5 and Opus 4.8/4.7/4.6/4.5: $5 / $6.25 / $10 / $0.50 / $25.
    Claude Sonnet 5 (through Aug 31, 2026): $2 / $2.50 / $4 / $0.20 / $10; (from Sep 1, 2026): $3 / $3.75
    / $6 / $0.30 / $15. Claude Sonnet 4.6 & 4.5: $3 / $3.75 / $6 / $0.30 / $15. Claude Haiku 4.5: $1 /
    $1.25 / $2 / $0.10 / $5. Batch: 50% off (e.g., Opus 4.8 $2.50 in / $12.50 out). "A cache hit costs
    10% of the standard input price, which means caching pays off after just one cache read for the 5-minute
    duration (1.25x write), or after two cache reads for the 1-hour duration (2x write)." Web search $10
    per 1,000 searches.

    '
  limitations: Prices subject to change; partner clouds (Bedrock/Vertex) have independent pricing; Sonnet
    5 has a dated pricing transition that must be tracked.
  evidence_nature: Authoritative provider price list (normative).
  relevance: Primary input to provider-cost-profiles.yaml; supplies the exact break-even arithmetic for
    cache-write-tier selection and model-downgrade savings ratios.
  generalizes_across_models: Anthropic-only; cross-provider comparison requires S-C04.
  confidence: high
  verification_status: verified-primary
- id: S-C03
  title: Prompt caching (OpenAI official documentation — automatic prompt caching)
  authors: OpenAI
  venue: OpenAI API docs (platform.openai.com -> developers.openai.com)
  year: 2026
  url: https://developers.openai.com/api/docs/guides/prompt-caching
  arxiv_id: null
  doi: null
  date_accessed: '2026-07-24'
  access_method: provider-doc
  source_type: provider-doc
  research_question: How does OpenAI's automatic prompt caching work and what discount/retention rules
    apply?
  setup: Official guide; caching is automatic (no cache_control API), routed by a hash of the initial
    prompt prefix. Fetched via 301 redirect from platform.openai.com/docs/guides/prompt-caching.
  main_findings: 'Caching is automatic for prompts of "1024 tokens or longer" on "all recent models, gpt-4o
    and newer". Requests are routed by a hash of the initial prefix; a hit applies the discounted cached-input
    rate and reduces latency. Guidance: place "static content like instructions and examples at the beginning
    of your prompt, and put variable content, such as user-specific information, at the end" — the same
    stable-prefix discipline as Anthropic, but with no explicit breakpoint control.

    '
  quantitative_results: 'Verbatim: minimum prompt length "1024 tokens or longer". Retention: for GPT-5.6
    models and later, cached content is "eligible for reuse for at least 30 minutes, but OpenAI may retain
    it longer"; older models keep cached prefixes for "5 to 10 minutes of inactivity, up to a maximum
    of one hour". Cache writes on GPT-5.6+ are "billed at 1.25x the uncached input token rate"; "Cache
    writes have no additional fee on models before the GPT-5.6 family". Cache reads are reported in usage.cached_tokens
    and billed at the per-model "cached input" rate (see S-C04: uniformly 0.1x input on listed models).

    '
  limitations: No user-visible TTL control and no explicit breakpoints; retention windows are best-effort
    ('may retain it longer'); read discount stated on the pricing page, not in this guide.
  evidence_nature: Authoritative provider specification (normative).
  relevance: Shows the second major provider converging on the same economics (1.25x write on newest family,
    ~0.1x read, prefix stability), which makes a provider-agnostic stable-prefix optimization rule viable.
  generalizes_across_models: OpenAI models gpt-4o and newer; write-fee rule differs between pre- and post-GPT-5.6
    families.
  confidence: high
  verification_status: verified-primary
