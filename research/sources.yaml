  title: Design Patterns for Securing LLM Agents against Prompt Injections
  authors: Luca Beurer-Kellner, Beat Buesser, Ana-Maria Creţu, Edoardo Debenedetti, Daniel Dobos, Daniel
    Fabian, Marc Fischer, David Froelicher, Kathrin Grosse, Daniel Naeff, Ezinwanne Ozoani, Andrew Paverd,
    Florian Tramèr, Václav Volhejn
  venue: 'arXiv preprint (Jun 2025; multi-org: invariantlabs/ETH/Google/Microsoft et al.)'
