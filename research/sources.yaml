  research_question: Can adversaries attack LLM-integrated applications remotely by embedding instructions
    in data the LLM retrieves, rather than by prompting it directly?
  setup: Introduces and demonstrates Indirect Prompt Injection (IPI) against real systems (Bing's GPT-4-powered
    Chat, code-completion engines) and synthetic GPT-4 applications; builds an attack taxonomy.
  main_findings: 'LLMs blur the data/instruction boundary, so retrieved content functions like arbitrary
    code execution: demonstrated data theft, worming, information-ecosystem contamination, and manipulation
    of application behavior/API calls; ''effective mitigations of these emerging threats are currently
    lacking'' (at time of writing).'
  quantitative_results: None in the abstract — the contribution is a demonstrated attack class and taxonomy,
    not benchmark rates.
  limitations: 2023-era systems; demonstrations rather than measured attack success rates at abstract
    level; defenses have evolved since.
  evidence_nature: causal (demonstrated attacks on real systems)
  relevance: 'The foundational reason the optimizer must treat optimized-target content (skill bodies,
    tool results, documents fed to the optimizer) as untrusted data: any text an LLM ingests is a potential
    instruction channel, so optimization pipelines need instruction/data separation and screening.'
  generalizes_across_models: yes — the data/instruction confusion is architectural, demonstrated across
    multiple LLM applications
  confidence: high
  verification_status: verified-primary
